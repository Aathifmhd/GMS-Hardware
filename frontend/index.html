<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMS Hardware · Credit Managing System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23f59e0b'/><text x='32' y='43' font-size='30' font-family='Arial' font-weight='900' text-anchor='middle' fill='%230b1020'>G</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>try { const t = localStorage.getItem('gms-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- Login -->
  <section id="login" class="login hidden">
    <div class="login-shell">
      <div class="login-side">
        <div class="brand-mark big">G</div>
        <h1>GMS Hardware</h1>
        <p>Credit Managing System</p>
        <div class="brand-by">by <b>Zenatiq Solutions</b></div>
      </div>
      <form id="loginForm" class="login-card">
        <h2>Sign in</h2>
        <p class="muted">Welcome back. Sign in to manage customer credit.</p>
        <label>Username<input name="username" autocomplete="username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary block" type="submit">Sign in</button>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div class="brand-text">
          <div class="brand-name" id="brandName">GMS Hardware</div>
          <div class="brand-sub">Credit Managing System</div>
          <div class="brand-by">by <b>Zenatiq Solutions</b></div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="user-menu hidden" id="userMenu" role="menu">
          <div class="theme-switch" role="radiogroup" aria-label="Theme">
            <button type="button" role="radio" data-theme-set="light"></button>
            <button type="button" role="radio" data-theme-set="dark"></button>
          </div>
          <a class="um-item" href="#/settings/account" role="menuitem" id="accountLink"></a>
          <button type="button" class="um-item danger" role="menuitem" id="logoutItem"></button>
        </div>
        <div class="user-chip" id="userChip" role="button" tabindex="0" aria-haspopup="menu" aria-controls="userMenu" aria-expanded="false"></div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu"></button>
        <div class="top-title"><h2 id="pageTitle">Dashboard</h2><div class="crumb" id="pageSub"></div></div>
        <div class="top-search">
          <input id="globalSearch" placeholder="Search customers… (/)" autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="top-actions">
          <button class="btn primary sm" id="quickCredit"></button>
          <button class="btn success sm" id="quickPay"></button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts"></div>

  <script src="/vendor/chart.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/customers.js"></script>
  <script src="/js/pages/entries.js"></script>
  <script src="/js/pages/setup.js"></script>
  <script src="/js/pages/messages.js"></script>
  <script src="/js/pages/reports.js"></script>
  <script src="/js/pages/owner.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
